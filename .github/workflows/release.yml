name: Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: windows-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'Release v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo & npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            frontend/node_modules
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main

      - name: Install AviUtl2 CLI via cargo binstall
        run: cargo binstall aviutl2-cli --no-confirm

      - name: Build Frontend
        run: |
          npm install --prefix frontend
          npm run build --prefix frontend

      - name: Build & Package with au2 release
        run: au2 release

      - name: Extract Tag or Version Title
        id: release_info
        shell: powershell
        run: |
          $msg = "${{ github.event.head_commit.message }}"
          $zipFile = Get-ChildItem -Path "release\*.zip" | Select-Object -First 1
          if ($zipFile) {
            echo "zip_path=$($zipFile.FullName)" >> $env:GITHUB_OUTPUT
            echo "zip_name=$($zipFile.Name)" >> $env:GITHUB_OUTPUT
          }

          if ("${{ github.ref }}" -like "refs/tags/*") {
            $tag = "${{ github.ref }}".Replace("refs/tags/", "")
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
          } elseif ($msg -match 'Release (v\d+\.\d+\.\d+)') {
            $tag = $matches[1]
            echo "tag=$tag" >> $env:GITHUB_OUTPUT
          } else {
            $ver = (Get-Content aviutl2.toml | Select-String 'version\s*=\s*"(.*?)"').Matches.Groups[1].Value
            echo "tag=v$ver" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.release_info.outputs.zip_path }}
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Release ${{ steps.release_info.outputs.tag }}
          generate_release_notes: true
